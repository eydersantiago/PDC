# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-adaceen-api-eyder05232002

on:
  push:
    branches:
      - feature/azure-config-observability
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present
          npm prune --omit=dev

      - name: Build ADACEEN VSIX
        run: |
          npm --prefix vscode-ext-prod ci
          npm --prefix vscode-ext-prod run package
          version=$(node -p "require('./vscode-ext-prod/package.json').version")
          (cd vscode-ext-prod && npx --yes @vscode/vsce package --out "adaceen-${version}.vsix")
          cp "vscode-ext-prod/adaceen-${version}.vsix" "vscode-ext-prod/adaceen.vsix"

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp package.json package-lock.json deploy-package/
          cp -R dist node_modules deploy-package/
          mkdir -p deploy-package/vscode-ext-prod
          vsix_path=$(find vscode-ext-prod -maxdepth 1 -type f -name 'adaceen-*.vsix' | sort -V | tail -n 1)
          if [ -z "$vsix_path" ]; then
            echo "No se encontro un VSIX de ADACEEN para empaquetar."
            exit 1
          fi
          cp "$vsix_path" deploy-package/vscode-ext-prod/
          cp "$vsix_path" deploy-package/vscode-ext-prod/adaceen.vsix
          # Descargas de /empezar (docs/arquitectura/acceso-simplificado.md, seccion 6).
          # El VSIX se sirve desde vscode-ext-prod/adaceen.vsix. Si algo de aqui falla,
          # el despliegue sigue y /empezar muestra "todavia no esta publicado".
          mkdir -p deploy-package/descargas
          ext_version=$(node -p "require('./browser-ext-prod/manifest.json').version")
          vscode_version=$(node -p "require('./vscode-ext-prod/package.json').version")
          if node scripts/empaquetar-extension.mjs && [ -f "dist/extension/adaceen-chromium-${ext_version}.zip" ]; then
            cp "dist/extension/adaceen-chromium-${ext_version}.zip" deploy-package/descargas/adaceen-navegador.zip
          else
            echo "::warning::No se pudo empaquetar la extension de navegador; /descargas/adaceen-navegador.zip no quedara publicado."
          fi
          mac_installer=deploy/mac/estudiante/Preparar-Mac-ADACEEN.command
          if [ -f "$mac_installer" ]; then
            cp "$mac_installer" deploy-package/descargas/Preparar-Mac-ADACEEN.command
            chmod 755 deploy-package/descargas/Preparar-Mac-ADACEEN.command
            # El zip conserva el permiso de ejecucion (al descargar el .command suelto, macOS lo pierde).
            (cd deploy-package/descargas && zip -q -X Preparar-Mac-ADACEEN.zip Preparar-Mac-ADACEEN.command)
          else
            echo "::warning::No existe ${mac_installer}; /empezar no ofrecera el instalador de Mac."
          fi
          printf '{"navegador":"%s","vscode":"%s"}\n' "$ext_version" "$vscode_version" > deploy-package/descargas/versiones.json
          [ -d data ] && cp -R data deploy-package/
          [ -f eng.traineddata ] && cp eng.traineddata deploy-package/
          [ -f spa.traineddata ] && cp spa.traineddata deploy-package/
          du -sh deploy-package

      - name: Paquetes firmados de la extension (CRX y XPI; opcionales)
        # Instalacion sin "Modo de desarrollador" (docs/operacion/publicar-extension.md): el CRX
        # firmado + adaceen-update.xml para la politica ExtensionInstallForcelist de los equipos
        # gestionados, y el XPI de Firefox firmado por addons.mozilla.org (instalacion permanente).
        # Sin la clave, los secretos o el XPI del repositorio, el despliegue sigue y /empezar
        # ofrece el zip y la carga temporal en Firefox.
        env:
          CRX_PRIVATE_KEY_PEM: ${{ secrets.CRX_PRIVATE_KEY_PEM }}
          CRX_CODEBASE_URL: ${{ vars.CRX_CODEBASE_URL }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          ext_version=$(node -p "require('./browser-ext-prod/manifest.json').version")
          if [ -n "$CRX_PRIVATE_KEY_PEM" ]; then
            if node scripts/empaquetar-crx.mjs && [ -f "dist/extension/adaceen-${ext_version}.crx" ]; then
              cp "dist/extension/adaceen-${ext_version}.crx" deploy-package/descargas/adaceen.crx
              cp dist/extension/adaceen-update.xml deploy-package/descargas/adaceen-update.xml
            else
              echo "::warning::No se pudo generar el CRX firmado; /descargas/adaceen.crx no quedara publicado."
            fi
          else
            echo "::notice::Sin el secreto CRX_PRIVATE_KEY_PEM no se publican adaceen.crx ni adaceen-update.xml (instalacion por politica)."
          fi
          # XPI de Firefox: el firmado a mano y guardado en el repositorio (opcion A) tiene prioridad;
          # si no esta, se firma aqui con las credenciales de AMO (opcion B). AMO firma cada version
          # una sola vez: si ya la firmo, hay que guardar ese XPI como $xpi_repo.
          xpi_repo="deploy/extension/adaceen-firefox-${ext_version}.xpi"
          firefox_zip="dist/extension/adaceen-firefox-${ext_version}.zip"
          if [ -f "$xpi_repo" ]; then
            cp "$xpi_repo" deploy-package/descargas/adaceen.xpi
            echo "XPI de Firefox tomado del repositorio: ${xpi_repo}"
          elif [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ] && [ -f "$firefox_zip" ]; then
            fuente="$RUNNER_TEMP/firefox-fuente"
            firmado="$RUNNER_TEMP/firefox-firmado"
            rm -rf "$fuente" "$firmado"
            mkdir -p "$fuente" "$firmado"
            unzip -q "$firefox_zip" -d "$fuente"
            if WEB_EXT_API_KEY="$AMO_JWT_ISSUER" WEB_EXT_API_SECRET="$AMO_JWT_SECRET" npx --yes web-ext@8 sign --source-dir "$fuente" --artifacts-dir "$firmado" --channel unlisted; then
              xpi_firmado=$(find "$firmado" -maxdepth 1 -type f -name '*.xpi' | head -n 1)
              if [ -n "$xpi_firmado" ]; then
                cp "$xpi_firmado" deploy-package/descargas/adaceen.xpi
              else
                echo "::warning::web-ext sign termino sin dejar un .xpi; /descargas/adaceen.xpi no quedara publicado."
              fi
            else
              echo "::warning::addons.mozilla.org no firmo la version ${ext_version} (si ya estaba firmada, guarda ese XPI como ${xpi_repo}); /descargas/adaceen.xpi no quedara publicado."
            fi
          else
            echo "::notice::Sin ${xpi_repo} ni los secretos AMO_JWT_ISSUER/AMO_JWT_SECRET: Firefox sigue con la carga temporal."
          fi
          ls -la deploy-package/descargas

      - name: Comprimir el paquete de despliegue
        run: (cd deploy-package && zip -qr ../node-app.zip .)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CE04F3CC64EF41D1A0846A559EFCA45E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FB2FB9163A8D40E68460AB00C08090B2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_84B5D09A999044FB8F98E51629EC0282 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-adaceen-api-eyder05232002'
          slot-name: 'Production'
          package: node-app.zip

      - name: Restart Azure Web App
        run: az webapp restart --resource-group rg-adaceen-azure --name app-adaceen-api-eyder05232002

      - name: Verify privacy policy route
        run: |
          for attempt in {1..18}; do
            status=$(curl -sS -o /tmp/privacy-policy.html -w "%{http_code}" https://app-adaceen-api-eyder05232002.azurewebsites.net/privacy-policy || true)
            health=$(curl -sS https://app-adaceen-api-eyder05232002.azurewebsites.net/api/health || true)
            echo "Attempt ${attempt}: /privacy-policy -> ${status}; /api/health -> ${health}"
            if [ "$status" = "200" ] && grep -q "Politica de privacidad" /tmp/privacy-policy.html; then
              exit 0
            fi
            sleep 10
          done
          cat /tmp/privacy-policy.html || true
          exit 1

      # Las mismas reglas que salud-produccion.yml (que no corre porque la rama por
      # defecto es master) mas avisos de configuracion: asi un despliegue que deja el
      # backend mal configurado se ve en el run y no en clase.
      - name: Verificar /api/health del backend desplegado
        run: |
          set -euo pipefail
          cuerpo=$(curl -fsS --retry 3 --retry-delay 10 --max-time 30 https://app-adaceen-api-eyder05232002.azurewebsites.net/api/health)
          echo "$cuerpo" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          problemas = []
          if d.get("ok") is not True: problemas.append("ok distinto de true")
          if d.get("database_provider") != "postgres": problemas.append("la base no es PostgreSQL (database_provider=%s)" % d.get("database_provider"))
          if d.get("telemetry_salt_configured") is not True: problemas.append("falta TELEMETRY_SALT")
          if d.get("mode") == "queue" and d.get("queue_configured") is not True: problemas.append("cola sin configurar")
          if d.get("worker_heartbeat_configured") is not True: problemas.append("falta WORKER_HEARTBEAT_TOKEN")
          avisos = []
          if d.get("workspace_provider") != "tunnel": avisos.append("el entorno activo no es tunnel (workspace_provider=%s)" % d.get("workspace_provider"))
          if d.get("workspace_provider") == "tunnel" and d.get("workspace_agent_online") is not True: avisos.append("la VM de editores no esta conectada (normal fuera de clase)")
          if d.get("cors_mode") not in (None, "default"): avisos.append("cors_mode=%s (ALLOWED_ORIGINS con valor)" % d.get("cors_mode"))
          if d.get("demo_accounts_seeded") is True: avisos.append("las cuentas demo siguen activas: pon SEED_DEMO_ACCOUNTS=false en el App Service")
          for a in avisos: print("::warning::" + a)
          if problemas:
              print("::error::/api/health: " + "; ".join(problemas))
              sys.exit(1)
          print("backend sano: mode=%s provider=%s agente=%s workers=%s" % (d.get("mode"), d.get("workspace_provider"), d.get("workspace_agent_online"), d.get("model_workers_alive")))
          '
          
