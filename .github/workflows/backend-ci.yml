name: Backend and VS Code Extension CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agente-proxy-azure/**"
      - "vscode-ext-prod"
      - "vscode-ext-prod/**"
      - ".github/workflows/backend-ci.yml"
      - ".gitmodules"
  push:
    branches:
      - main
      - feature/azure-config-observability
    paths:
      - "agente-proxy-azure/**"
      - "vscode-ext-prod"
      - "vscode-ext-prod/**"
      - ".github/workflows/backend-ci.yml"
      - ".gitmodules"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-proxy-azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agente-proxy-azure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  vscode-extension:
    name: VS Code extension compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-ext-prod/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

  deploy-backend:
    name: Deploy backend to Azure
    runs-on: ubuntu-latest
    needs:
      - backend
      - vscode-extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/azure-config-observability'
    environment: production
    defaults:
      run:
        working-directory: agente-proxy-azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agente-proxy-azure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: agente-proxy-azure
